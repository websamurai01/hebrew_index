<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5ede0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Иврит · Тренажёры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('hebrew_theme_v1');}catch(e){}if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    color-scheme: light;
    --bg: #f5ede0;
    --bg2: #efe4d2;
    --bg-glow: #fff6e8;
    --header-bg: rgba(245, 237, 224, .92);
    --card: #fffaf3;
    --card2: #faf3e7;
    --input-focus: #ffffff;
    --accent: #c8654d;
    --accent-btn: #c8654d;
    --accent-grad: #e08a5e;
    --accent2: #2d7d8c;
    --olive: #6b8e4e;
    --text: #3d3528;
    --muted: #8a7d68;
    --faint: #b3a48a;
    --border: #e2d4bd;
    --shadow: 0 8px 28px rgba(150, 110, 60, .14);
    --shadow-soft: 0 4px 14px rgba(150, 110, 60, .07);
    --hebrew: "Noto Serif Hebrew", "Frank Ruhl Libre", "David Libre", "Noto Sans Hebrew",
              "Times New Roman", "DejaVu Sans", serif;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16120f;
    --bg2: #1d1813;
    --bg-glow: #2a2119;
    --header-bg: rgba(22, 18, 15, .92);
    --card: #241e18;
    --card2: #2d251d;
    --input-focus: #292219;
    --accent: #e08a6a;
    --accent-btn: #b15c43;
    --accent-grad: #cf7354;
    --accent2: #6fb8c2;
    --olive: #9cbf72;
    --text: #efe4d3;
    --muted: #a99a84;
    --faint: #7f7260;
    --border: #483b2d;
    --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    --shadow-soft: 0 4px 14px rgba(0, 0, 0, .3);
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Roboto", sans-serif;
    min-height: 100vh; min-height: 100dvh;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex; flex-direction: column;
    max-width: 560px; margin: 0 auto;
    background: radial-gradient(120% 60% at 50% 0%, var(--bg-glow) 0%, var(--bg) 55%, var(--bg2) 100%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .title {
    font-size: 20px; font-weight: 800; text-align: center;
    color: var(--accent); letter-spacing: .3px;
  }
  .subtitle {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-align: center; margin-top: 4px;
  }
  .lang-switch {
    position: absolute; top: 12px; left: 14px;
    display: flex; gap: 4px;
  }
  .flag-btn {
    width: 32px; height: 26px; padding: 0;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    opacity: .42; transition: opacity .2s, box-shadow .2s, transform .15s, border-color .2s;
  }
  .flag-btn:active { transform: scale(.94); }
  .flag-btn.active {
    opacity: 1; border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(200, 101, 77, .2);
  }
  .flag-btn span { pointer-events: none; }
  .theme-btn {
    position: absolute; top: 12px; right: 14px;
    width: 34px; height: 28px; padding: 0;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--card); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    transition: transform .15s, border-color .2s;
  }
  .theme-btn:active { transform: scale(.94); }
  main {
    flex: 1; padding: 22px 16px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .project-link {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 20px 18px;
    text-decoration: none; color: var(--text);
    box-shadow: var(--shadow);
    transition: transform .18s, border-color .2s, box-shadow .2s;
  }
  .project-link:hover { border-color: var(--accent); box-shadow: 0 10px 32px rgba(200, 101, 77, .22); }
  .project-link:active { transform: scale(.98); }
  .project-link.placeholder {
    border-style: dashed;
    box-shadow: var(--shadow-soft);
    opacity: .82;
  }
  .project-link.placeholder:hover { opacity: 1; }
  .project-icon {
    flex-shrink: 0; width: 62px; height: 62px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-btn), var(--accent-grad));
    color: #fff; font-size: 30px; line-height: 1;
    box-shadow: 0 6px 18px rgba(200, 101, 77, .3);
  }
  .project-icon.hebrew {
    font-family: var(--hebrew);
    font-size: 34px; font-weight: 700;
  }
  .project-icon.placeholder {
    background: var(--card2);
    color: var(--faint);
    border: 1px dashed var(--border);
    box-shadow: none;
  }
  .project-body { flex: 1; min-width: 0; }
  .project-name {
    font-size: 17px; font-weight: 800; color: var(--text);
    margin-bottom: 3px;
  }
  .project-desc {
    font-size: 12px; font-weight: 600; color: var(--muted);
    line-height: 1.45;
  }
  .project-arrow {
    flex-shrink: 0; font-size: 20px; color: var(--faint);
    transition: transform .18s, color .2s;
  }
  .project-link:hover .project-arrow { transform: translateX(3px); color: var(--accent); }
  footer {
    padding: 12px 16px 22px; text-align: center;
    font-size: 11px; font-weight: 600; color: var(--faint);
  }
</style>
</head>
<body>

<header>
  <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Язык">
    <button class="flag-btn" type="button" data-lang="ru" title="Русский" aria-label="Русский"><span aria-hidden="true">🇷🇺</span></button>
    <button class="flag-btn" type="button" data-lang="en" title="English" aria-label="English"><span aria-hidden="true">🇺🇸</span></button>
  </div>
  <button class="theme-btn" id="btn-theme" type="button" title="Тёмная тема" aria-label="Тёмная тема">🌙</button>
  <div class="title" data-i18n="appTitle">Иврит · Тренажёры</div>
  <div class="subtitle" data-i18n="subtitle">Выбери, что тренировать</div>
</header>

<main>
  <a class="project-link" href="https://websamurai01.github.io/alphabet_trainer/">
    <div class="project-icon hebrew" aria-hidden="true">א</div>
    <div class="project-body">
      <div class="project-name" data-i18n="alphabetName">Алфавит</div>
      <div class="project-desc" data-i18n="alphabetDesc">Имена букв, звуки, никуд и софитные формы</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>

  <a class="project-link" href="https://websamurai01.github.io/hebrew_words/">
    <div class="project-icon" aria-hidden="true">📚</div>
    <div class="project-body">
      <div class="project-name" data-i18n="wordsName">100 слов</div>
      <div class="project-desc" data-i18n="wordsDesc">Обучение, словарь и проверка в обе стороны</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>

  <a class="project-link placeholder" href="#">
    <div class="project-icon placeholder" aria-hidden="true">✨</div>
    <div class="project-body">
      <div class="project-name" data-i18n="newProjectName">Новый проект</div>
      <div class="project-desc" data-i18n="newProjectDesc">Скоро здесь появится ссылка</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>

  <a class="project-link placeholder" href="#">
    <div class="project-icon placeholder" aria-hidden="true">🧩</div>
    <div class="project-body">
      <div class="project-name" data-i18n="newProjectName">Новый проект</div>
      <div class="project-desc" data-i18n="newProjectDesc">Скоро здесь появится ссылка</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>
</main>


<script>
(function () {
  'use strict';

  var LS_THEME = 'hebrew_theme_v1';
  var LS_LANG = 'hebrew_index_lang_v1';
  var root = document.documentElement;
  var themeBtn = document.getElementById('btn-theme');
  var flagBtns = Array.prototype.slice.call(document.querySelectorAll('.flag-btn'));

  var I18N = {
    ru: {
      appTitle: 'Иврит · Тренажёры',
      subtitle: 'Выбери, что тренировать',
      alphabetName: 'Алфавит',
      alphabetDesc: 'Имена букв, звуки, никуд и софитные формы',
      wordsName: '100 слов',
      wordsDesc: 'Обучение, словарь и проверка в обе стороны',
      newProjectName: 'Новый проект',
      newProjectDesc: 'Скоро здесь появится ссылка',
      footer: 'Локальные офлайн-тренажёры · прогресс хранится в браузере',
      themeDark: 'Тёмная тема',
      themeLight: 'Светлая тема'
    },
    en: {
      appTitle: 'Hebrew · Trainers',
      subtitle: 'Choose what to practice',
      alphabetName: 'Alphabet',
      alphabetDesc: 'Letter names, sounds, niqqud and final forms',
      wordsName: '100 words',
      wordsDesc: 'Learning, dictionary and two-way review',
      newProjectName: 'New project',
      newProjectDesc: 'A link will appear here soon',
      footer: 'Local offline trainers · progress is stored in your browser',
      themeDark: 'Dark theme',
      themeLight: 'Light theme'
    }
  };

  function loadLang() {
    try {
      var v = localStorage.getItem(LS_LANG);
      if (v === 'en' || v === 'ru') return v;
    } catch (e) {}
    return 'ru';
  }

  var currentLang = loadLang();
  var currentTheme = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';

  function t(key) {
    var dict = I18N[currentLang] || I18N.ru;
    return dict[key] !== undefined ? dict[key] : I18N.ru[key];
  }

  function updateFlags() {
    flagBtns.forEach(function (b) {
      var active = b.dataset.lang === currentLang;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function updateThemeButton() {
    var dark = currentTheme === 'dark';
    themeBtn.textContent = dark ? '☀️' : '🌙';
    var label = t(dark ? 'themeLight' : 'themeDark');
    themeBtn.title = label;
    themeBtn.setAttribute('aria-label', label);
  }

  function applyLanguage() {
    root.lang = currentLang;
    document.title = t('appTitle');
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.dataset.i18n);
    });
    updateFlags();
    updateThemeButton();
  }

  function setLang(code) {
    if (code !== 'en' && code !== 'ru') return;
    if (code === currentLang) return;
    currentLang = code;
    try { localStorage.setItem(LS_LANG, code); } catch (e) {}
    applyLanguage();
  }

  function applyTheme(theme, persist) {
    currentTheme = theme === 'dark' ? 'dark' : 'light';
    root.setAttribute('data-theme', currentTheme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', currentTheme === 'dark' ? '#16120f' : '#f5ede0');
    if (persist) {
      try { localStorage.setItem(LS_THEME, currentTheme); } catch (e) {}
    }
    updateThemeButton();
  }

  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
  });

  flagBtns.forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang); });
  });

  applyTheme(currentTheme, false);
  applyLanguage();
})();
</script>
</body>
</html>
