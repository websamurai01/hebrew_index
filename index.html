<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5ede0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Иврит · Тренажёры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('hebrew_theme_v1');}catch(e){}if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Язык">
    <button class="flag-btn" type="button" data-lang="ru" title="Русский" aria-label="Русский"><span aria-hidden="true">🇷🇺</span></button>
    <button class="flag-btn" type="button" data-lang="en" title="English" aria-label="English"><span aria-hidden="true">🇺🇸</span></button>
  </div>
  <button class="theme-btn" id="btn-theme" type="button" title="Тёмная тема" aria-label="Тёмная тема">🌙</button>
  <div class="title" data-i18n="appTitle">Иврит · Тренажёры</div>
  <div class="subtitle" data-i18n="subtitle">Выбери, что тренировать</div>
</header>

<main>
  <a class="project-link" href="https://websamurai01.github.io/alphabet_trainer/">
    <div class="project-icon hebrew" aria-hidden="true">א</div>
    <div class="project-body">
      <div class="project-name" data-i18n="alphabetName">Алфавит</div>
      <div class="project-desc" data-i18n="alphabetDesc">Имена букв, звуки, никуд и софитные формы</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>

  <a class="project-link" href="https://websamurai01.github.io/hebrew_words/">
    <div class="project-icon" aria-hidden="true">📚</div>
    <div class="project-body">
      <div class="project-name" data-i18n="wordsName">100 слов</div>
      <div class="project-desc" data-i18n="wordsDesc">Обучение, словарь и проверка в обе стороны</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>

  <a class="project-link" href="https://websamurai01.github.io/pronouns_trainer">
    <div class="project-icon" aria-hidden="true">🫂</div>
    <div class="project-body">
      <div class="project-name" data-i18n="pronounsName">Местоимения</div>
      <div class="project-desc" data-i18n="pronounsDesc">Формы с предлогами, роли и фразы</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>

  <a class="project-link placeholder" href="#">
    <div class="project-icon placeholder" aria-hidden="true">🧩</div>
    <div class="project-body">
      <div class="project-name" data-i18n="newProjectName">Новый проект</div>
      <div class="project-desc" data-i18n="newProjectDesc">Скоро здесь появится ссылка</div>
    </div>
    <div class="project-arrow" aria-hidden="true">→</div>
  </a>
</main>


<script src="js/app.js"></script>
</body>
</html>
